name: Chinese Novelist V3 tests
on:
  pull_request:
    paths:
      - "chinese-novelist-v3/**"
      - ".github/workflows/chinese-novelist-v3.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chinese-novelist-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/tests/init_chapter_summaries.test.mjs
      - run: node scripts/tests/validate_project.test.mjs
      - run: node scripts/tests/v3_gate.test.mjs
      - run: node scripts/tests/check_repetition.test.mjs
      - run: python3 -m unittest discover -s scripts/tests -p 'test_snapshot.py'
